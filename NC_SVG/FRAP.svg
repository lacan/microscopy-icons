      <path d="M8,52 C70,72 150,74 232,46"/>
      <path d="M18,210 C60,168 92,120 128,64 C142,42 152,24 158,8"/>
      <path d="M12,136 C60,158 120,180 168,208 C196,224 216,232 232,238"/>
